# Loli Raspberry Pi (子) - CanWeeb 設定

[node]
node_id = "loli-encoder-sender"
role = "child"
tags = ["encoder", "sensor"]

[storage]
root = "./data/loli-raspi"
retention_seconds = 3600

[web]
bind = "0.0.0.0:8080"

[transport]
network_listen = "0.0.0.0:7002"
connect_interval_ms = 1500
heartbeat_interval_ms = 1000
ack_timeout_ms = 2500
max_hops = 4

[discovery]
enabled = true
bind = "0.0.0.0:7060"
announce_addr = "255.255.255.255:7060"
announce_interval_ms = 1500
peer_ttl_ms = 8000

[[peers]]
node_id = "loli-visualizer"
role = "parent"
relationship = "parent"
preferred_transport_order = ["network"]
tags = ["visualizer", "ui"]
