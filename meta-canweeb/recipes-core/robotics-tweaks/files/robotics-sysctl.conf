# sysctl tunables for low-latency robotics operation

# Network: reduce bufferbloat, tune for low latency UDP
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576
net.core.netdev_max_backlog = 5000
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_low_latency = 1
net.ipv4.udp_rmem_min = 65536
net.ipv4.udp_wmem_min = 65536

# Disable IPv6 if not needed (saves some overhead)
# net.ipv6.conf.all.disable_ipv6 = 1

# VM: minimize swap usage to avoid latency spikes
vm.swappiness = 1
vm.dirty_ratio = 5
vm.dirty_background_ratio = 2
vm.dirty_expire_centisecs = 500
vm.dirty_writeback_centisecs = 100

# Reduce scheduler migration overhead
kernel.sched_migration_cost_ns = 5000000
kernel.sched_autogroup_enabled = 0

# Allow RT processes to lock memory
kernel.perf_event_paranoid = -1

# Increase max open files for many connections
fs.file-max = 131072

# Watchdog: keep NMI watchdog but soften soft lockup threshold
kernel.watchdog_thresh = 60
kernel.nmi_watchdog = 1
