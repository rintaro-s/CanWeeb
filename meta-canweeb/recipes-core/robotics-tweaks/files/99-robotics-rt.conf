# systemd manager configuration for real-time robotics use
[Manager]
# Use cgroups v2 unified hierarchy
DefaultCPUAccounting=yes
DefaultMemoryAccounting=yes
DefaultTasksAccounting=yes

# Reduce systemd watchdog overhead
RuntimeWatchdogSec=30s
ShutdownWatchdogSec=10min

# Tighten journal to reduce I/O jitter
DefaultStandardOutput=journal
DefaultStandardError=journal

# Raise default limits for RT processes
DefaultLimitRTPRIO=99
DefaultLimitRTTIME=infinity
DefaultLimitMEMLOCK=infinity
DefaultLimitNOFILE=65536
