# Robotics competition optimizations for CanWeeb

# GPIO and hardware access
CONFIG_GPIO_SYSFS=y
CONFIG_GPIO_CDEV=y
CONFIG_GPIO_CDEV_V1=y
CONFIG_I2C_DEV=y
CONFIG_SPI_SPIDEV=y
CONFIG_SERIAL_8250=y

# USB serial (for Arduino/microcontroller comms)
CONFIG_USB_SERIAL=y
CONFIG_USB_SERIAL_GENERIC=y
CONFIG_USB_SERIAL_CP210X=y
CONFIG_USB_SERIAL_FTDI_SIO=y
CONFIG_USB_SERIAL_CH341=y

# CAN bus (optional for robot comms)
CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_CAN_MCP251X=y

# Rotary encoder kernel support
CONFIG_INPUT_GPIO_ROTARY_ENCODER=y

# Network performance
CONFIG_NET_SCH_FQ=y
CONFIG_NET_SCH_FQ_CODEL=y
CONFIG_TCP_CONG_BBR=y
CONFIG_NET_SCH_DEFAULT=y

# Disable unused filesystems (reduce attack surface + boot time)
CONFIG_CIFS=n
CONFIG_NFS_FS=n
CONFIG_NFSD=n
CONFIG_SMB_SERVER=n
CONFIG_CODA_FS=n
CONFIG_AFS_FS=n

# Disable Bluetooth HCI unnecessary protocols
CONFIG_BT_HCIUART_3WIRE=n
CONFIG_BT_HCIUART_INTEL=n

# cgroups for process isolation
CONFIG_CGROUPS=y
CONFIG_CGROUP_SCHED=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_RT_GROUP_SCHED=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CPUSETS=y

# CPU frequency scaling - performance governor default
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_GOV_PERFORMANCE=y
CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y
CONFIG_CPU_FREQ_GOV_POWERSAVE=n
CONFIG_CPU_FREQ_GOV_ONDEMAND=n
CONFIG_CPU_FREQ_GOV_CONSERVATIVE=n
CONFIG_CPU_FREQ_GOV_SCHEDUTIL=n

# Watchdog
CONFIG_WATCHDOG=y
CONFIG_BCM2835_WDT=y
CONFIG_SOFT_WATCHDOG=y

# Disable power management features that cause latency spikes
CONFIG_CPU_IDLE=n
CONFIG_SUSPEND=n
CONFIG_PM_SLEEP=n
CONFIG_HIBERNATION=n

# POSIX realtime extensions
CONFIG_POSIX_MQUEUE=y
CONFIG_FUTEX=y
