# PREEMPT_RT full preemption
CONFIG_PREEMPT_RT=y
CONFIG_PREEMPT=y
CONFIG_PREEMPT_COUNT=y
CONFIG_PREEMPTION=y

# High resolution timers required for RT
CONFIG_HZ_1000=y
CONFIG_HZ=1000
CONFIG_HIGH_RES_TIMERS=y
CONFIG_NO_HZ_FULL=y

# IRQ threading
CONFIG_IRQ_FORCED_THREADING=y
CONFIG_THREADED_IRQ=y

# Lock debugging off (reduces latency)
CONFIG_LOCKDEP=n
CONFIG_DEBUG_LOCK_ALLOC=n
CONFIG_PROVE_LOCKING=n
CONFIG_DEBUG_SPINLOCK=n
CONFIG_DEBUG_MUTEXES=n
CONFIG_DEBUG_RT_MUTEXES=n

# CPU isolation support
CONFIG_CPU_ISOLATION=y

# Memory locking
CONFIG_EXPERT=y
CONFIG_MEMCG=y
